name: Universal harness CI

on:
  pull_request:
  push:
    branches:
      - main
      - agent/universal-harness-prototype

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: tar -czf agent-bus-source.tgz --exclude=.git --exclude=node_modules --exclude=dist --exclude=dist-test .
      - uses: actions/upload-artifact@v4
        with:
          name: agent-bus-source
          path: agent-bus-source.tgz
          retention-days: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
