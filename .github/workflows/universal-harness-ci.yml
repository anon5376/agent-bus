name: Universal harness CI

on:
  pull_request:
  push:
    branches:
      - main
      - fix/product-stability

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: bash -n install.sh scripts/cleanup-old-installations.sh
      - run: google-chrome --version
      - run: command -v lsof
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Audit before safe lockfile fix
        run: npm audit --json || true
      - name: Apply safe lockfile-only audit fixes
        run: npm audit fix --package-lock-only --ignore-scripts || true
      - name: Audit after safe lockfile fix
        run: npm audit --json || true
      - name: Commit refreshed lockfile on stabilization branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/product-stability'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: refresh npm lockfile"
            git push origin HEAD:fix/product-stability
          fi
      - run: npm ci
      - run: npm test
