name: Universal harness CI

on:
  pull_request:
  push:
    branches:
      - main
      - fix/product-stability

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: bash -n install.sh scripts/cleanup-old-installations.sh
      - run: google-chrome --version
      - run: npm install
      - run: npm test
