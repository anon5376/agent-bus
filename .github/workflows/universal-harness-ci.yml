name: Universal harness CI

on:
  pull_request:
  push:
    branches:
      - fix/review-confirmed-issues

permissions:
  contents: write

jobs:
  patch-browser-smoke:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/fix/review-confirmed-issues' || github.event.pull_request.head.ref == 'fix/review-confirmed-issues'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/review-confirmed-issues
      - name: Make browser session reload deterministic
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/browser-smoke.mjs')
          text = path.read_text()

          before = '      await waitForJson(`http://127.0.0.1:${debugPort}/json/version`);'
          after = '      await waitForJson(`http://127.0.0.1:${debugPort}/json/version`, 20_000);'
          if text.count(before) != 1:
              raise SystemExit('DevTools startup wait target missing or ambiguous')
          text = text.replace(before, after, 1)

          before = 'const replayProfile = join(root, "replay-profile");'
          after = 'const reloadProfile = join(root, "reload-profile");\nconst replayProfile = join(root, "replay-profile");'
          if text.count(before) != 1:
              raise SystemExit('reload profile insertion target missing or ambiguous')
          text = text.replace(before, after, 1)

          before = '''  let agentModelFieldsChecked = false;
  const first = await runChrome(`${handle.url}/?ticket=${encodeURIComponent(ticket)}&build=${encodeURIComponent(runtime.buildId)}&launch=chrome-smoke`, profile, async (state, cdp) => {
    if (!(state.mounted && state.rootChildren > 0 && state.text.includes("Agent Bus") && state.search === "" && state.boot?.highest === 10)) return false;
    if (!agentModelFieldsChecked) { await verifyAgentModelFields(cdp); agentModelFieldsChecked = true; }
    const cookies = await cdp.send("Network.getCookies", { urls: [handle.url] });
    return cookies.cookies.some((cookie) => cookie.name === "agent_bus_session" && cookie.httpOnly === true);
  }, "ticket login");
'''
          after = '''  let agentModelFieldsChecked = false;
  let sessionCookie = null;
  const first = await runChrome(`${handle.url}/?ticket=${encodeURIComponent(ticket)}&build=${encodeURIComponent(runtime.buildId)}&launch=chrome-smoke`, profile, async (state, cdp) => {
    if (!(state.mounted && state.rootChildren > 0 && state.text.includes("Agent Bus") && state.search === "" && state.boot?.highest === 10)) return false;
    if (!agentModelFieldsChecked) { await verifyAgentModelFields(cdp); agentModelFieldsChecked = true; }
    const cookies = await cdp.send("Network.getCookies", { urls: [handle.url] });
    sessionCookie = cookies.cookies.find((cookie) => cookie.name === "agent_bus_session" && cookie.httpOnly === true) ?? null;
    return Boolean(sessionCookie);
  }, "ticket login");
'''
          if text.count(before) != 1:
              raise SystemExit('session cookie capture target missing or ambiguous')
          text = text.replace(before, after, 1)

          before = '''  const reload = await runChrome(handle.url, profile, async (state) => state.mounted && state.rootChildren > 0 && state.text.includes("Agent Bus") && state.search === "" && state.boot?.highest === 10, "session reload");
  assertAllCheckpoints(reload.state, "session reload");
  assertCleanBrowser(reload, "session reload");
'''
          after = '''  assert.ok(sessionCookie?.value, "ticket login did not expose the HttpOnly session cookie to CDP");
  const reload = await runChrome(handle.url, reloadProfile, async (state) => state.mounted && state.rootChildren > 0 && state.text.includes("Agent Bus") && state.search === "" && state.boot?.highest === 10, "session reload", {
    beforeNavigate: (cdp) => cdp.send("Network.setCookie", {
      name: "agent_bus_session",
      value: sessionCookie.value,
      url: handle.url,
      httpOnly: true,
      sameSite: "Strict",
    }),
  });
  assertAllCheckpoints(reload.state, "session reload");
  assertCleanBrowser(reload, "session reload");
'''
          if text.count(before) != 1:
              raise SystemExit('session reload target missing or ambiguous')
          path.write_text(text.replace(before, after, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/browser-smoke.mjs
          git diff --cached --check
          git commit -m 'test: make browser session reload deterministic'
          git push origin HEAD:fix/review-confirmed-issues
