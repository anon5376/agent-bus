name: Apply PR6 review round2 fixes

on:
  push:
    branches:
      - debug/pr6-review-round2

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: debug/pr6-review-round2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply fixes
        run: |
          set -euo pipefail
          node scripts/apply-review-round2.mjs
          rm scripts/apply-review-round2.mjs .github/workflows/apply-review-round2.yml
      - run: npm ci
      - run: npm test
      - name: Commit validated source
        run: |
          set -euo pipefail
          rm -rf dist-test
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: close latest PR6 review issues'
          git push origin HEAD:debug/pr6-review-round2
