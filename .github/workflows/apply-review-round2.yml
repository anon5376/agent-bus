name: Apply PR6 review round2 fixes

on:
  push:
    branches:
      - debug/pr6-review-round2

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: debug/pr6-review-round2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply fixes without mutating workflows
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-review-round2.mjs')
          text = path.read_text()
          start = text.index('\nupdate(".github/workflows/universal-harness-ci.yml",')
          end = text.index('\n\nprocess.stdout.write("review round2 fixes applied', start)
          path.write_text(text[:start] + text[end:])
          PY
          node scripts/apply-review-round2.mjs
          rm scripts/apply-review-round2.mjs
      - run: npm ci
      - run: npm test
      - name: Commit validated source
        run: |
          set -euo pipefail
          rm -rf dist-test
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: close latest PR6 review issues'
          git push origin HEAD:debug/pr6-review-round2
