name: Export PR6 base checkout

on:
  push:
    branches:
      - debug/product-finish-mcp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/installed-dashboard-runtime
      - name: Pack PR6 base checkout
        run: tar --exclude=.git -czf "$RUNNER_TEMP/agent-bus-pr6-base.tgz" .
      - uses: actions/upload-artifact@v4
        with:
          name: agent-bus-pr6-base
          path: ${{ runner.temp }}/agent-bus-pr6-base.tgz
          retention-days: 1
