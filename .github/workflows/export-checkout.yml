name: Export staging checkout

on:
  pull_request:
  push:
    branches:
      - debug/product-finish-mcp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: debug/product-finish-mcp
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pack runnable checkout
        run: tar --exclude=.git -czf "$RUNNER_TEMP/agent-bus-workspace.tgz" .
      - uses: actions/upload-artifact@v4
        with:
          name: agent-bus-workspace
          path: ${{ runner.temp }}/agent-bus-workspace.tgz
          retention-days: 1
