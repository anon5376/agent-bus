name: Apply universal harness prototype

on:
  push:
    branches: ["agent/universal-harness-prototype"]
    paths: [".github/workflows/apply-universal-harness.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and apply implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .github/patch-parts/* | base64 --decode | gzip --decompress > /tmp/universal.patch
          git apply --index /tmp/universal.patch
          rm -rf .github/patch-parts
          rm -f .github/workflows/apply-universal-harness.yml
          git config user.name "agent-bus builder"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Build universal multi-model harness prototype"
          git push origin HEAD:agent/universal-harness-prototype

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test
