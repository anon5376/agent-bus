name: Apply universal harness prototype

on:
  push:
    branches: ["agent/universal-harness-prototype"]
    paths: [".github/workflows/apply-universal-harness.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply implementation and publish branch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/agent-bus-payload.* | base64 --decode | gzip --decompress > /tmp/agent-bus.patch
          git apply --index --binary --exclude='.github/**' /tmp/agent-bus.patch

          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.scripts.test = 'npm run build && npm run test:compile && mkdir -p dist-test && cp agent-bus.config.json dist-test/agent-bus.config.json && node --test dist-test/tests/*.test.js';
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

          rm -f .github/agent-bus-payload.* .github/export-trigger
          rm -rf .github/patch-parts

          git config user.name "agent-bus builder"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Build universal multi-model harness prototype"
          git push origin HEAD:agent/universal-harness-prototype

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test
