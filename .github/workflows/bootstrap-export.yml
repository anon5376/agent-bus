name: bootstrap-export
on:
  push:
    branches: ["agent/universal-harness-prototype"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: agent-bus-source
          path: .
          include-hidden-files: true
