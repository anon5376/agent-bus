name: export-current
on:
  push:
    branches: ["agent/universal-harness-prototype"]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: current-branch-source
          path: .
          include-hidden-files: true
