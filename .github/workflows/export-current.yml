name: export-current
on:
  push:
    branches: ["agent/universal-harness-prototype"]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/upload-artifact@v4
        with:
          name: current-branch-source
          path: .
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: current-node-modules
          path: node_modules
          include-hidden-files: true
