name: Finalize remaining merge minors

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'fix/installed-dashboard-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/installed-dashboard-runtime
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch readable source and regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected block not found in {path}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          replace_exact(
              "src/operator-control.ts",
              '    const state = await this.call<OperatorState>("/state");\n    return { ok: true, running: true, occupied: true, health: probe.health, ...state };\n',
              '    let state = await this.call<OperatorState>("/state");\n    let pruned = false;\n    for (const entry of state.roster ?? []) {\n      const agentId = String(entry.id ?? "");\n      const pid = Number(entry.supervisorPid);\n      if (!agentId || !Number.isInteger(pid) || pid <= 0) continue;\n      if (await this.clearStaleSupervisor(agentId, pid)) pruned = true;\n    }\n    if (pruned) state = await this.call<OperatorState>("/state");\n    return { ok: true, running: true, occupied: true, health: probe.health, ...state };\n',
          )

          replace_exact(
              "src/broker.ts",
              '          this.supervisorMeta.delete(target);\n          throw new ConflictError(`supervisor ownership cannot be verified for ${target}`);\n',
              '          this.supervisorMeta.delete(target);\n          const staleAgent = this.agents.get(target);\n          if (staleAgent) {\n            staleAgent.status = "offline";\n            this.store.saveAgent(staleAgent);\n          }\n          this.audit("supervisor_stale", { target, pid: meta.pid });\n          throw new ConflictError(`supervisor ownership cannot be verified for ${target}`);\n',
          )

          replace_exact(
              "tests/operator-safety.test.ts",
              '    await waitForExit(firstPid);\n\n    const operatorToken = readFileSync(join(home, "operator.token"), "utf8").trim();\n',
              '    await waitForExit(firstPid);\n\n    const staleStatus = await call(client, "agent_bus_status");\n    const staleRow = (staleStatus.roster ?? []).find((entry: any) => entry.id === "fake-small");\n    assert.equal(staleRow?.supervisorPid ?? null, null, "status must prune a dead supervisor immediately");\n    assert.equal(staleRow?.status, "offline", "status must report the agent offline immediately after supervisor death");\n\n    const operatorToken = readFileSync(join(home, "operator.token"), "utf8").trim();\n',
          )

          package = Path("package.json")
          text = package.read_text()
          old_bundle = '    "test:bundle": "node scripts/verify-production-bundle.mjs",\n'
          old_test = '    "test": "npm run build && npm run test:bundle && npm run test:unit && npm run test:browser && npm run test:lifecycle",\n'
          if old_bundle not in text or old_test not in text:
              raise SystemExit("expected package.json test scripts not found")
          text = text.replace(
              old_bundle,
              '    "test:dist": "git diff --exit-code -- dist",\n    "test:bundle": "node scripts/verify-production-bundle.mjs",\n',
              1,
          )
          text = text.replace(
              old_test,
              '    "test": "npm run build && npm run test:dist && npm run test:bundle && npm run test:unit && npm run test:browser && npm run test:lifecycle",\n',
              1,
          )
          package.write_text(text)
          PY
      - name: Regenerate committed distribution
        run: |
          npm run build
          git add dist
      - name: Validate final source and committed distribution
        run: npm test
      - run: git diff --check
      - name: Commit readable source and generated dist
        run: |
          git config user.name 'anon5376'
          git config user.email 'anon5376@proton.me'
          git rm .github/workflows/finalize-minors.yml
          git add src/operator-control.ts src/broker.ts tests/operator-safety.test.ts package.json dist
          git diff --cached --check
          git status --short
          git commit -m 'fix: make operator status truthful and sync dist'
          git push origin HEAD:fix/installed-dashboard-runtime
