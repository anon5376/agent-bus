name: Audit live peer reinstall

on:
  pull_request:

permissions:
  contents: read

jobs:
  live-peer-reinstall:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Keep same-home peer alive through reinstall
        run: |
          set -euo pipefail
          export AGENT_BUS_HOME="$RUNNER_TEMP/agent-bus-peer-home"
          export AGENT_BUS_INSTALL_DIR="$RUNNER_TEMP/agent-bus-peer-bin"
          mkdir -p "$AGENT_BUS_HOME" "$AGENT_BUS_INSTALL_DIR"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const config = JSON.parse(readFileSync('agent-bus.config.json', 'utf8'));
          for (const [id, value] of Object.entries(config.providers)) if (id !== 'fake') value.enabled = false;
          for (const [id, value] of Object.entries(config.harnesses)) if (id !== 'fake') value.enabled = false;
          for (const [id, value] of Object.entries(config.models)) if (!id.startsWith('fake-')) value.enabled = false;
          for (const [id, value] of Object.entries(config.agents)) if (!id.startsWith('fake-')) value.enabled = false;
          writeFileSync(join(process.env.AGENT_BUS_HOME, 'config.json'), `${JSON.stringify(config, null, 2)}\n`, { mode: 0o600 });
          NODE
          export PATH="$AGENT_BUS_INSTALL_DIR:$PATH"
          bash install.sh
          cleanup() {
            agent-bus stop >/dev/null 2>&1 || true
            if [[ -n "${alt_port:-}" ]]; then AGENT_BUS_PORT="$alt_port" AGENT_BUS_URL="http://127.0.0.1:$alt_port" agent-bus stop >/dev/null 2>&1 || true; fi
          }
          trap cleanup EXIT
          cd "$RUNNER_TEMP"
          agent-bus start --no-open
          primary_health="$(curl -fsS http://127.0.0.1:7717/health)"
          primary_pid="$(printf '%s' "$primary_health" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).pid')"
          alt_port="$(python3 - <<'PY'
          import socket
          s=socket.socket(); s.bind(('127.0.0.1',0)); print(s.getsockname()[1]); s.close()
          PY
          )"
          alt_url="http://127.0.0.1:$alt_port"
          AGENT_BUS_PORT="$alt_port" AGENT_BUS_URL="$alt_url" agent-bus start --no-open
          alt_health="$(curl -fsS "$alt_url/health")"
          alt_pid="$(printf '%s' "$alt_health" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).pid')"
          agent-bus stop
          curl -fsS "$alt_url/health" >/dev/null
          agent-bus start --no-open
          primary_health="$(curl -fsS http://127.0.0.1:7717/health)"
          primary_pid="$(printf '%s' "$primary_health" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).pid')"
          for release_id in 11111111111111111111 22222222222222222222 33333333333333333333; do
            mkdir -p "$AGENT_BUS_HOME/app/releases/$release_id"
            printf '%s\n' "$release_id" > "$AGENT_BUS_HOME/app/releases/$release_id/ARTIFACT_ID"
            sleep 0.05
          done
          kill -STOP "$primary_pid"
          cd "$GITHUB_WORKSPACE"
          bash install.sh
          if ! kill -0 "$alt_pid" 2>/dev/null; then echo 'peer process was killed by reinstall' >&2; exit 1; fi
          test "$(curl -fsS "$alt_url/health" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).pid')" = "$alt_pid"
          curl -fsS "$alt_url/?peer-reinstall=1" | grep 'data-boot-stage="10"'
          AGENT_BUS_PORT="$alt_port" AGENT_BUS_URL="$alt_url" agent-bus stop
          alt_port=""
          trap - EXIT
