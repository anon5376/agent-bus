name: Finalize universal harness

on:
  push:
    branches:
      - agent/universal-harness-prototype

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply final validated fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          config_path = Path("agent-bus.config.json")
          config = config_path.read_text()
          for agent_id in ("fake-small", "fake-strong"):
              pattern = rf'("{re.escape(agent_id)}":\s*\{{[^\n]*?"shell":)false'
              config, count = re.subn(pattern, r'\1true', config)
              if count == 0 and not re.search(rf'"{re.escape(agent_id)}":\s*\{{[^\n]*?"shell":true', config):
                  raise SystemExit(f"could not update shell permission for {agent_id}")
          config_path.write_text(config)

          helpers_path = Path("tests/helpers.ts")
          helpers = helpers_path.read_text()
          marker = '  config.roles.reviewer.families = ["fake-small-family", "fake-strong-family"];\n'
          insertion = marker + '  config.roles.reviewer.minimumCapability = 0.20;\n'
          if 'config.roles.reviewer.minimumCapability = 0.20;' not in helpers:
              if marker not in helpers:
                  raise SystemExit("reviewer test configuration marker missing")
              helpers = helpers.replace(marker, insertion, 1)
          helpers_path.write_text(helpers)

          broker_path = Path("src/broker.ts")
          broker = broker_path.read_text()
          old_condition = 'if (!task.readOnly && this.config.constraints.isolation === "path-locks" && task.runId) {'
          new_condition = 'if (!task.readOnly && this.config.constraints.isolation === "path-locks") {'
          if old_condition in broker:
              broker = broker.replace(old_condition, new_condition, 1)
          elif new_condition not in broker:
              raise SystemExit("path lease condition marker missing")

          old_lease = 'const lease = this.store.acquirePathLeases(task.id, task.runId, projectRoot, task.pathScopes.length ? task.pathScopes : ["."]);'
          new_lease = 'const leaseGroup = task.runId ?? `standalone:${projectRoot}`;\n      const lease = this.store.acquirePathLeases(task.id, leaseGroup, projectRoot, task.pathScopes.length ? task.pathScopes : ["."]);'
          if old_lease in broker:
              broker = broker.replace(old_lease, new_lease, 1)
          elif 'const leaseGroup = task.runId ?? `standalone:${projectRoot}`;' not in broker:
              raise SystemExit("path lease call marker missing")
          broker_path.write_text(broker)
          PY
      - name: Validate complete prototype
        run: |
          npm test
          git diff --check
      - name: Commit clean final tree
        run: |
          rm -rf dist-test
          rm -f .github/workflows/export-current.yml
          rm -f .github/workflows/finalize-universal-harness.yml
          git config user.name "agent-bus automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix final routing and path-lock regressions"
          git push origin HEAD:agent/universal-harness-prototype
