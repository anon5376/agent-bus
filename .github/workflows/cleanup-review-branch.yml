name: Cleanup review branch

on:
  push:
    branches:
      - fix/review-confirmed-issues

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/fix/review-confirmed-issues'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/review-confirmed-issues
      - name: Remove generated test output and cleanup workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r --ignore-unmatch dist-test
          git rm .github/workflows/cleanup-review-branch.yml
          git commit -m 'chore: remove generated test output'
          git push origin HEAD:fix/review-confirmed-issues
