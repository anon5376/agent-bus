name: Validate CLI supervisor config pinning

on:
  push:
    branches:
      - debug/pr6-review-round2

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: debug/pr6-review-round2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pin CLI autostart supervisors to broker config source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('src/cli.ts')
          text=path.read_text()
          replacements=[
            ('import { BusConfig, enabledAgents, loadConfig } from "./config.js";', 'import { BusConfig, DEFAULT_CONFIG_PATH, enabledAgents, loadConfig } from "./config.js";'),
            ('function startSupervisor(agentId:string,workdir:string):number{mkdirSync(join(BUS_HOME,"logs"),{recursive:true});const log=openSync(join(BUS_HOME,"logs",`${agentId}.out`),"a");const child=spawn(process.execPath,[CLI_PATH,"supervise",agentId,workdir],{detached:true,stdio:["ignore",log,log]});child.unref();return child.pid??0}', 'function startSupervisor(agentId:string,workdir:string,configPath:string):number{mkdirSync(join(BUS_HOME,"logs"),{recursive:true});const log=openSync(join(BUS_HOME,"logs",`${agentId}.out`),"a");const child=spawn(process.execPath,[CLI_PATH,"supervise",agentId,workdir],{detached:true,stdio:["ignore",log,log],env:{...process.env,AGENT_BUS_CONFIG:configPath}});child.unref();return child.pid??0}'),
            (';await ensureBrokerStarted();const config=loadConfig();const started:{id:string;pid:number}[]=[];', ';const configPath=process.env.AGENT_BUS_CONFIG??DEFAULT_CONFIG_PATH;await ensureBrokerStarted();const config=loadConfig(configPath);const started:{id:string;pid:number}[]=[];'),
            ('started.push({id:agent.id,pid:startSupervisor(agent.id,workdir)})', 'started.push({id:agent.id,pid:startSupervisor(agent.id,workdir,configPath)})'),
          ]
          for before,after in replacements:
            if text.count(before)!=1: raise SystemExit(f'patch target count {text.count(before)} for {before[:80]}')
            text=text.replace(before,after,1)
          path.write_text(text)
          PY
          npm ci
          npm test
          rm -rf dist-test
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/cli.ts dist/cli.js dist/cli.js.map
          git diff --cached --check
          git commit -m 'fix: pin CLI supervisors to broker config source'
          git push origin HEAD:debug/pr6-review-round2
